<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Soft aura behind the mark (stacked translucent rings) -->
  <circle cx="256" cy="256" r="210" fill="#6B8AFF" opacity="0.05" />
  <circle cx="256" cy="256" r="165" fill="#6B8AFF" opacity="0.06" />
  <circle cx="256" cy="256" r="122" fill="#A78BFA" opacity="0.06" />

  <!-- Eye socket — symmetric lens -->
  <path d="M 88 256 C 160 163 352 163 424 256 C 352 349 160 349 88 256 Z" fill="#16203F" opacity="0.55" />
  <!-- Upper eyelid -->
  <path d="M 88 256 C 160 163 352 163 424 256" fill="none" stroke="#6B8AFF" stroke-width="16" stroke-linecap="round" />
  <!-- Lower eyelid -->
  <path d="M 88 256 C 160 349 352 349 424 256" fill="none" stroke="#6B8AFF" stroke-width="13" stroke-linecap="round" opacity="0.92" />
  <!-- Canthus glints -->
  <circle cx="88"  cy="256" r="3.5" fill="#A4B8FF" />
  <circle cx="424" cy="256" r="3.5" fill="#A4B8FF" />
  <!-- Full-moon iris -->
  <circle cx="256" cy="256" r="78" fill="#D4DBEC" />
  <!-- Maria -->
  <g fill="#2C3658" opacity="0.5">
    <ellipse cx="232" cy="230" rx="16" ry="11" transform="rotate(-22 232 230)" />
    <ellipse cx="262" cy="222" rx="10" ry="7" />
    <ellipse cx="284" cy="238" rx="11" ry="8" transform="rotate(18 284 238)" />
    <ellipse cx="298" cy="262" rx="7"  ry="6" />
    <ellipse cx="268" cy="280" rx="9"  ry="6" transform="rotate(-10 268 280)" />
    <ellipse cx="236" cy="288" rx="7"  ry="5" transform="rotate(20 236 288)" />
  </g>
  <g fill="#2C3658" opacity="0.38">
    <circle cx="220" cy="258" r="2.4" />
    <circle cx="306" cy="232" r="1.8" />
    <circle cx="252" cy="304" r="2.6" />
  </g>
  <!-- Specular highlight -->
  <ellipse cx="226" cy="222" rx="11" ry="5" transform="rotate(-32 226 222)" fill="#FFFFFF" opacity="0.55" />
  <!-- Terminator shadow -->
  <ellipse cx="298" cy="298" rx="44" ry="27" transform="rotate(-40 298 298)" fill="#1A2244" opacity="0.32" />
  <!-- Lucid spark -->
  <circle cx="332" cy="300" r="13"  fill="#5EEAD4" opacity="0.22" />
  <circle cx="332" cy="300" r="5"   fill="#5EEAD4" />
  <circle cx="332" cy="300" r="1.8" fill="#FFFFFF" />
